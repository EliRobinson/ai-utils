# CI for the ai-utils marketplace. One job, `validate`, runs the same checks
# agents run locally (see docs/agents/ci.md). It must pass before a merge.
#
# Hardening, checked by scripts/validate-plugins.py:
# - read-only token, no secrets, never pull_request_target
# - every action pinned to a full commit SHA (Dependabot keeps them fresh)
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Test the validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate plugins, skills, templates and this workflow
        run: python3 scripts/validate-plugins.py

      - name: Check the agent hooks
        run: node scripts/check-agent-hooks.mjs

      - name: Check the asks board page
        run: node plugins/asks-board/skills/asks-board-setup/scripts/check-board-page.mjs
