<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Asks for {{OWNER}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column. Header with a summary across projects, project filter, then
   To do (grouped by project in the All view, with a kind filter), Waiting for the chat, Closed. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --panel-2: #eceee9;
  --ink: #1b2224;
  --muted: #54626a;
  --line: #d6dbd3;
  --line-strong: #a9b2a6;
  --control-line: #6f7a6c;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #e1ecf5;
  --ok: #2b6a4a;
  --error: #a12a2a;
  --error-soft: #fbe9e7;
  --do: #2b6a4a;
  --decide: #7d5000;
  --approve: #7a2f6b;
  --code-bg: #eceee9;
  --skeleton: #e3e6e0;
  --shadow: 0 1px 2px rgb(20 30 30 / 0.06), 0 2px 8px rgb(20 30 30 / 0.04);
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
/* The dark tokens are written twice (system setting, and data-theme="dark"): keep both blocks the same. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121819; --panel: #1a2224; --panel-2: #161d1f; --ink: #e6ebe8; --muted: #a0adae; --line: #2c383b; --line-strong: #4a585c; --control-line: #7b8a8f;
    --accent: #78b8e3; --accent-ink: #0b1820; --accent-soft: #1c3242;
    --ok: #74d3a0; --error: #ff9a8f; --error-soft: #3a1f1d;
    --do: #74d3a0; --decide: #e9b955; --approve: #e5a0d6; --code-bg: #232c2f; --skeleton: #222b2e;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121819; --panel: #1a2224; --panel-2: #161d1f; --ink: #e6ebe8; --muted: #a0adae; --line: #2c383b; --line-strong: #4a585c; --control-line: #7b8a8f;
  --accent: #78b8e3; --accent-ink: #0b1820; --accent-soft: #1c3242;
  --ok: #74d3a0; --error: #ff9a8f; --error-soft: #3a1f1d;
  --do: #74d3a0; --decide: #e9b955; --approve: #e5a0d6; --code-bg: #232c2f; --skeleton: #222b2e;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: var(--accent); text-underline-offset: 0.18em; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 740px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 24px; }

/* Header */
header { display: grid; gap: 6px; }
h1 { font-weight: 700; font-size: 1.75rem; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.summary { margin: 0; font-size: 1.0625rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.summary strong { font-variant-numeric: tabular-nums; }
.summary > span + span::before { content: "·"; margin-right: 14px; color: var(--muted); }
.sub { color: var(--muted); margin: 0; font-size: 0.9375rem; max-width: 62ch; }

/* Filters: chips with aria-pressed */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters-label { color: var(--muted); font-size: 0.875rem; margin-right: 2px; }
.chip { font: inherit; font-size: 0.9375rem; font-weight: 700; min-height: 36px; max-width: 100%; overflow-wrap: anywhere; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip:hover { border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.n { font-family: var(--mono); font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .n { opacity: 0.8; }

/* Banner (lost live link) */
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--error-soft); color: var(--ink); border: 1px solid var(--error); border-radius: 10px; padding: 10px 14px; }
.banner svg { color: var(--error); }

/* Sections */
section { display: grid; gap: 12px; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
h2, .h2 { font-weight: 700; font-size: 1.1875rem; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h2 .n, .h2 .n { color: var(--muted); font-size: 0.875rem; }
.section-note { margin: -6px 0 0; color: var(--muted); font-size: 0.875rem; }
.group { display: grid; gap: 10px; }
.group + .group { margin-top: 8px; }
h3.group-head { font-size: 0.9375rem; font-weight: 700; color: var(--muted); margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: baseline; }
.list { display: grid; gap: 10px; }

/* Card */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 8px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 4px; box-shadow: var(--shadow); }
.card.wait { background: var(--panel-2); box-shadow: none; }
.card.closed { background: transparent; box-shadow: none; padding-block: 10px; }
.tick { display: grid; place-items: start center; padding-top: 2px; min-height: 44px; cursor: pointer; }
.check { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.check:disabled { cursor: default; }
/* A card's status and answer controls while its click saves (lockCard). */
.locked:disabled { cursor: progress; }
.locked:disabled:not(.chosen) { opacity: 0.6; }
.btn.locked:hover { background: transparent; }
.main { display: grid; gap: 10px; min-width: 0; }
.head { display: grid; gap: 4px; }
.meta { color: var(--muted); font-size: 0.875rem; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
.meta > span { display: inline-flex; gap: 5px; align-items: center; }
.kind { font-weight: 700; }
.meta .proj { font-weight: 700; color: var(--ink); }
.kind.do { color: var(--do); } .kind.decide { color: var(--decide); } .kind.approve { color: var(--approve); }
.title { font-weight: 700; font-size: 1.0625rem; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.closed .title { font-weight: 400; color: var(--muted); }
.state { font-weight: 700; color: var(--ink); }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Options */
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.opt { font: inherit; text-align: left; border: 1px solid var(--control-line); background: var(--panel); color: var(--ink); padding: 10px 12px; border-radius: 10px; cursor: pointer; display: grid; gap: 2px; min-height: 48px; align-content: start; }
.opt:hover { border-color: var(--accent); }
.opt .key { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .key b { font-family: var(--mono); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.opt small { font-size: 0.9375rem; color: inherit; }
.tag { font-size: 0.75rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 8px; }
.opt.rec { border-color: var(--accent); }
.opt.chosen { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.chosen .tag { background: var(--accent-ink); color: var(--accent); }
.opt.nokey { border-style: dashed; color: var(--muted); cursor: default; }
/* An option that takes no click: no key, or locked while its card saves. */
.opt.nokey:hover, .opt.locked:not(.rec, .chosen):hover { border-color: var(--control-line); }
/* Answered cards are quieter: the chosen option is outlined, not filled. */
.wait .opt.chosen { background: var(--accent-soft); color: var(--ink); border-width: 2px; }
.wait .opt.chosen .tag { background: var(--accent); color: var(--accent-ink); }

/* Actions */
.actions { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-left: -8px; }
.btn { font: inherit; font-size: 0.9375rem; font-weight: 700; border: 1px solid transparent; background: transparent; color: var(--accent); padding: 6px 10px; min-height: 36px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.line { border-color: var(--line-strong); }
.btn[aria-expanded="true"] .ico { transform: rotate(180deg); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.receipt:focus-visible { outline-offset: -1px; }

/* Feedback next to the card */
.feedback { margin: 0; font-size: 0.9375rem; display: flex; gap: 6px; align-items: flex-start; }
.feedback .ico { margin-top: 3px; }
.feedback.ok { color: var(--ok); }
.feedback.busy, .feedback.info { color: var(--muted); }
.feedback.error { color: var(--error); }
.receipt { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; color: var(--muted); }
.receipt .title { font-size: 0.9375rem; color: var(--muted); }

/* Detail, notes, code */
.detail { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; max-width: 70ch; }
.wait .detail { background: var(--panel); }
.detail p { margin: 0; overflow-wrap: anywhere; }
.detail ul, .detail ol { margin: 0; padding-left: 1.3em; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.detail code { background: var(--panel); }
.code { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.code pre { margin: 0; padding: 10px 12px; padding-right: 76px; overflow-x: auto; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.5; }
.code pre code { background: none; padding: 0; }
.code .btn { position: absolute; top: 4px; right: 4px; background: var(--panel); }
.note { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: 0.9375rem; overflow-wrap: anywhere; }
.compose { display: grid; gap: 8px; }
.compose label { font-weight: 700; font-size: 0.9375rem; }
textarea { font: inherit; width: 100%; min-height: 88px; border: 1px solid var(--control-line); border-radius: 10px; padding: 10px 12px; background: var(--panel); color: var(--ink); resize: vertical; caret-color: var(--accent); }
textarea:focus-visible { outline-offset: 0; border-color: var(--accent); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { margin: 0; display: grid; gap: 4px; justify-items: start; }
.thumb img { display: block; max-width: min(220px, 100%); max-height: 140px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
.hint { color: var(--muted); font-size: 0.875rem; margin: 0; }

/* Empty, loading */
.empty { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 20px; display: grid; gap: 4px; justify-items: start; }
.empty strong { font-size: 1.0625rem; }
.empty p { margin: 0; color: var(--muted); }
.skel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--skeleton); }
.skel i:nth-child(1) { width: 30%; } .skel i:nth-child(2) { width: 75%; height: 16px; } .skel i:nth-child(3) { width: 55%; }

/* Closed */
details.closed-wrap > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; min-height: 44px; border-radius: 8px; }
details.closed-wrap > summary::-webkit-details-marker { display: none; }
details.closed-wrap > summary .ico { color: var(--muted); transform: rotate(-90deg); }
details.closed-wrap[open] > summary .ico { transform: none; }
details.closed-wrap .list { margin-top: 8px; gap: 6px; }

@media (max-width: 520px) {
  .wrap { padding-inline: 12px; padding-top: 16px; gap: 20px; }
  h1 { font-size: 1.5rem; }
  .card { grid-template-columns: 40px minmax(0, 1fr); padding-right: 12px; }
}
@media (max-width: 520px), (pointer: coarse) { .btn, .chip { min-height: 44px; } }
@media (prefers-reduced-motion: no-preference) {
  .btn .ico, details.closed-wrap > summary .ico { transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
  .feedback, .receipt { animation: rise .25s cubic-bezier(.2, .8, .2, 1); }
  .skel i { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } }
  @keyframes pulse { 50% { opacity: 0.55; } }
}
@media (forced-colors: active) {
  .chip[aria-pressed="true"], .opt.chosen { outline: 2px solid CanvasText; }
}
</style>

<main class="wrap">
  <header>
    <h1>Asks for {{OWNER}}</h1>
    <p class="summary" id="summary"></p>
    <p class="sub">What your Claude chats need from you. Tick it when done, pick an answer, or add a note. Each click is saved and sent to the chat that asked.</p>
  </header>
  <div class="banner" id="banner" role="alert" hidden></div>
  <div class="filters" id="projects" role="group" aria-label="Show project" hidden></div>
  <section aria-labelledby="h-open">
    <div class="section-head">
      <h2 id="h-open" tabindex="-1" data-k="h-open">To do <span class="n" id="n-open"></span></h2>
      <div class="filters" id="kinds" role="group" aria-label="Show kind" hidden></div>
    </div>
    <div class="list" id="open" aria-busy="true">
      <p class="sr">Loading your asks…</p>
      <div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </section>
  <section aria-labelledby="h-wait" id="wait-wrap" hidden>
    <h2 id="h-wait">Waiting for the chat <span class="n" id="n-wait"></span></h2>
    <p class="section-note">You’ve handled these. The chat closes each one when it acts.</p>
    <div class="list" id="wait"></div>
  </section>
  <details class="closed-wrap" id="closed-wrap" hidden>
    <summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="h2" id="h-closed">Closed <span class="n" id="n-closed"></span></span></summary>
    <div class="list" id="closed" role="group" aria-labelledby="h-closed"></div>
  </details>
  <p class="sr" id="status" role="status"></p>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // BEGIN pure (scripts/check-board-page.mjs runs these in node)
  // Every status: the section its row goes in, and the label its card shows. Only status
  // "closed" puts a row in Closed: an old ackAt on an answered row must still show it as
  // waiting. An unknown status lands in wait, so a row with a typo never vanishes.
  const STATUS = {
    open: { section: "open", label: "To do" },
    done: { section: "wait", label: "Done" },
    answered: { section: "wait", label: "Answered" },
    dismissed: { section: "wait", label: "Not needed" },
    closed: { section: "closed", label: "Closed" },
  };
  // A row's status; a row with none is open.
  function statusKey(a) { return String(a.status || "open"); }
  function statusOf(a) {
    const st = statusKey(a);
    // Own keys only: a status such as "constructor" must not reach Object.prototype.
    return Object.hasOwn(STATUS, st) ? STATUS[st] : { section: "wait", label: "Status not recognized: " + oneLine(st) };
  }
  function byCreated(x, y) { return String(x.createdAt).localeCompare(String(y.createdAt)); }
  function sections(rows) {
    const out = { open: [], wait: [], closed: [] };
    for (const d of rows) out[statusOf(d.data).section].push(d);
    out.open.sort((x, y) => byCreated(x.data, y.data));
    out.closed.sort((x, y) => String(y.data.updatedAt).localeCompare(String(x.data.updatedAt)));
    out.closedTotal = out.closed.length;
    out.closed = out.closed.slice(0, 40);
    return out;
  }
  // Every click writes this: the change, a fresh updatedAt, and ackAt cleared (db has
  // no field delete, so null), so the chat sees the click as new.
  function stamp(patch, now) {
    return Object.assign({ updatedAt: now }, patch, { ackAt: null });
  }
  const LINE_BREAKS = /[\r\n\v\f\u0085\u2028\u2029]+/g;
  // Text on one line (a line break could add a fake line to the ping text), without
  // invisible format or control characters (they can reorder or hide text). An object or
  // list is not text, so it counts as missing.
  function oneLine(v) {
    if (v == null || typeof v === "object") return "";
    return String(v).replace(LINE_BREAKS, " ").replace(/\t/g, " ").replace(/[\p{Cc}\p{Cf}]/gu, "").trim();
  }
  // At most n characters, cut on whole characters, with "…" when cut.
  function cut(s, n) {
    const cps = [...s];
    return cps.length > n ? cps.slice(0, n - 1).join("") + "…" : s;
  }
  // One value in the ping header: one line, letters, digits, spaces and plain punctuation
  // only (look-alikes are folded first, so no | = [ ] of any width), at most 80 characters,
  // so a row cannot add or fake a header field.
  function headerValue(v, fallback) {
    const s = oneLine(v).normalize("NFKC").replace(/[^\p{L}\p{N}\p{M} ._\-'’()&,:\/#@+]/gu, " ").replace(/[ǀǁǂǃ]/g, " ").replace(/\s+/g, " ").trim();
    return cut(s || fallback, 80);
  }
  // A ping reaches the chat only when the header names the ask and its project exactly as
  // the row does: the router looks both up by that name.
  function pingable(d) {
    const id = oneLine(d.id), p = oneLine(d.data.project);
    return id !== "" && headerValue(id, "") === id && (p === "" || headerValue(p, "") === p);
  }
  // Row text inside a ping line: in quotes, so the router reads it as the ask's words and
  // not the owner's. One line, no quote marks of its own of any kind, at most n characters.
  function quoted(v, n) {
    return "\"" + cut(oneLine(v).normalize("NFKC").replace(/["'`\p{Pi}\p{Pf}′″‴‵‶‷〝〞〟「」『』„‟＂＇]/gu, " ").replace(/\s+/g, " ").trim(), n) + "\"";
  }
  // One option's key and label, each on one line. Rows use {key, label}; a row written with
  // {id, label} still works, and an empty key falls back to id. A bare string is its own
  // key. key is "" when there is no usable key or id: the button must not write then.
  function option(o) {
    if (o == null) return { key: "", label: "" };
    if (typeof o !== "object") return { key: oneLine(o), label: "" };
    return { key: oneLine(o.key) || oneLine(o.id), label: oneLine(o.label) };
  }
  // A row value (answer, recommended) names this key. The empty key matches nothing, so a
  // row with no answer or no recommended marks no button.
  function matchesKey(value, key) {
    return key !== "" && value != null && oneLine(value) === key;
  }
  // Everything one option button shows and does. send is what a click writes, says and
  // pings; it is null when the option has no key, and then a click writes nothing.
  // Chosen wins over recommended for the style.
  function optionButton(o, row) {
    const { key, label } = option(o);
    const chosen = matchesKey(row.answer, key);
    const rec = matchesKey(row.recommended, key);
    const writable = key !== "";
    return {
      key, label, chosen, rec, writable,
      cls: "opt" + (!writable ? " nokey" : chosen ? " chosen" : rec ? " rec" : ""),
      text: key || "(no key)",
      send: writable ? ACTIONS.answer(key, label) : null,
    };
  }
  // Every click, as data: what it writes (patch), what the page says (said), and the line
  // the ping carries (ping; null sends no ping). Each is called the same way.
  const ACTIONS = {
    answer: (key, label) => ({
      patch: { status: "answered", answer: key },
      said: "Answered “" + key + "”.",
      ping: "{{OWNER}} chose option " + quoted(key, 40) + (label ? ": " + quoted(label, 200) : "") + ".",
    }),
    done: () => ({ patch: { status: "done" }, said: "Marked done.", ping: "{{OWNER}} marked this done." }),
    reopen: () => ({ patch: { status: "open", answer: null }, said: "Moved back to To do.", ping: null }),
    dismiss: () => ({ patch: { status: "dismissed" }, said: "Marked not needed.", ping: "{{OWNER}} marked this not needed." }),
    note: (text, imgs, now) => {
      const t = String(text == null ? "" : text).trim();
      const patch = { note: t || null, noteImages: imgs, noteAt: now };
      if (!t && !imgs.length) return { patch, said: "Note removed.", ping: "{{OWNER}} removed their note." };
      return {
        patch,
        said: "Note saved.",
        ping: "{{OWNER}} left a note" + (imgs.length ? " with " + imgs.length + " image(s)" : "") + ":\n" + (t || "(no text)"),
      };
    },
  };
  // A click that sets the status and answer the row already has (a second click on the
  // chosen answer) changes nothing, so it saves and pings nothing. A click that sets no
  // status (a note) always counts.
  function changesNothing(row, patch) {
    if (!("status" in patch) || statusKey(row) !== patch.status) return false;

      showProject ? el("span", { class: "proj", text: projectOf(d) }) : null,
      el("span", { text: fromOf(d) }),
      el("span", { text: ago(where === "open" ? a.createdAt : a.updatedAt || a.createdAt, now) }),
      state ? el("span", { class: "state", text: state[0].toUpperCase() + state.slice(1) }) : null,
    ]);
    main.append(el("div", { class: "head" }, [meta, el("h" + level, { class: "title", id: titleId }, [inline(titleOf(a))])]));

    const images = imageList(a.images);
    if (live && images.length) main.append(thumbs(images, "img", d.id));
    if (live && Array.isArray(a.options) && a.options.length) {
      const opts = el("div", { class: "options", role: "group", "aria-label": "Answers" });
      let noKey = false;
      a.options.forEach((o, i) => {
        const b = optionButton(o, a);
        if (!b.writable) noKey = true;
        opts.append(ctl("button", "opt" + i, d, { "data-lock": "",
          class: b.cls, type: "button", "aria-pressed": String(b.chosen),
          onclick: (ev) => b.writable ? act(ev, d, b.send, where) : noKeyClick(d, where),
        }, [
          el("span", { class: "key" }, [el("b", { text: b.text }), b.rec ? el("span", { class: "tag", text: "Recommended" }) : null]),
          b.label ? el("small", { text: b.label }) : null,
        ]));
      });
      main.append(opts);
      if (noKey) main.append(el("p", { class: "hint", text: "An option marked (no key) can’t be sent. " + NO_KEY_ADVICE }));
    }
    const saved = hasNote(a);
    if (saved) {
      const n = el("div", { class: "note" }, [el("strong", { text: "Your note: " }), oneLine(a.note) === "" ? "" : String(a.note)]);
      const noteImages = imageList(a.noteImages);
      if (noteImages.length) n.append(thumbs(noteImages, "nimg", d.id));
      main.append(n);
    }

    const row = el("div", { class: "actions" });
    if (a.detail) {
      const showing = openDetails.has(d.id);
      row.append(ctl("button", "det", d, { class: "btn", type: "button", "aria-expanded": String(showing), "aria-controls": detailId,
        onclick: () => { showing ? openDetails.delete(d.id) : openDetails.add(d.id); requestRender(true); } }, [showing ? "Hide details" : "Details", icon("more")]));
    }
    const composing = live && composers.has(d.id);
    if (live) {
      row.append(ctl("button", "nb", d, Object.assign({ class: "btn", type: "button", "aria-expanded": String(composing),
        onclick: () => { if (composing) closeNote(d); else openNote(d); requestRender(true); } }, composing ? { "aria-controls": composeId } : {}),
        [icon("note"), saved ? "Edit note" : "Add a note"]));
    }
    if (where === "open") {
      row.append(ctl("button", "dis", d, { "data-lock": "", class: "btn", type: "button",
        onclick: (ev) => act(ev, d, ACTIONS.dismiss(), where) }, [icon("dismiss"), "Not needed"]));
    }
    if (row.childNodes.length) main.append(row);
    // A card that left To do shows its result on the receipt there, not twice.
    const f = flashes.get(d.id);
    if (f && now < f.until && !(where !== "open" && hasReceipt(f, now))) main.append(feedbackLine(f));
    if (a.detail && openDetails.has(d.id)) main.append(renderDetail(a.detail, detailId, d.id));
    if (composing) main.append(composer(d, where, composeId));
    item.append(main);
    if (busy.has(d.id)) lockCard(item);
    return item;
  }

  function noKeyClick(d, where) {
    flash(d.id, "This option has no key, so nothing was sent. " + NO_KEY_ADVICE, "error", where);
    openNote(d);
    requestRender(true);
  }

  function composer(d, where, id) {
    const a = d.data;
    const c = composers.get(d.id);
    const taId = "note-" + d.id, hintId = "nh-" + d.id;
    const ta = ctl("textarea", "ta", d, { id: taId, "aria-describedby": hintId });
    ta.value = c.draft != null ? c.draft : a.note == null ? "" : String(a.note);
    const hadNote = hasNote(a);
    const sendBtn = ctl("button", "send", d, { class: "btn primary", type: "button" });
    // Send waits while the card's last click still saves, so the note is not sent too early.
    const sync = () => { const b = noteButton(ta.value, c.pics.length, hadNote); sendBtn.disabled = b.disabled || busy.has(d.id); sendBtn.textContent = b.label; };
    sendBtn.sync = sync;
    sync();
    ta.addEventListener("input", () => { c.draft = ta.value; sync(); });
    ta.addEventListener("paste", (ev) => {
      const files = [...(ev.clipboardData ? ev.clipboardData.files : [])].filter((f) => f.type.startsWith("image/"));
      if (files.length) { ev.preventDefault(); addPics(d.id, files, where); }
    });
    const send = (ev) => {
      if (sendBtn.disabled) return;
      // The last click on this card is still saving: keep the note for a second try.
      if (busy.has(d.id)) { flash(d.id, NOTE_WAIT, "info", where); requestRender(true); return; }
      const note = ACTIONS.note(ta.value, c.pics.slice(), new Date().toISOString());
      closeNote(d);
      act(ev, d, note, where);
    };
    sendBtn.addEventListener("click", send);
    ta.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); send(ev); } });
    const btns = el("div", { class: "actions" }, [
      sendBtn,
      ctl("button", "cancel", d, { class: "btn", type: "button", onclick: () => { closeNote(d); requestRender(true); } }, ["Cancel"]),
    ]);
    const box = el("div", { class: "compose", id }, [el("label", { for: taId, text: "Note for " + fromOf(d) })]);
    box.append(ta);
    if (assets) {
      const fi = el("input", { type: "file", accept: "image/*", multiple: "", hidden: "" });
      fi.addEventListener("change", () => { addPics(d.id, [...fi.files], where); fi.value = ""; });
      btns.append(fi, ctl("button", "img", d, { class: "btn", type: "button", onclick: () => fi.click() }, [icon("image"), "Add image"]));
    }
    box.append(el("p", { class: "hint", id: hintId, text: (assets ? "Paste a screenshot into the box, or add an image. " : "") + "Ctrl or ⌘ + Enter sends." }));
    if (c.pics.length) box.append(thumbs(c.pics, "pic", d.id, (i) => { c.pics.splice(i, 1); focusNext = fkey("ta", d.id); requestRender(true); }));
    box.append(btns);
    return box;
  }

  function receipt(d) {
    return ctl("div", "rcpt", d, { class: "receipt", tabindex: "-1" }, [
      el("p", { class: "title" }, [inline(titleOf(d.data))]),
      feedbackLine(flashes.get(d.id)),
    ]);
  }

  function empty(title, text, action) {
    return el("div", { class: "empty" }, [el("strong", { text: title }), text ? el("p", { text }) : null, action || null]);
  }
  function reloadBtn() {
    return el("button", { class: "btn line", type: "button", onclick: () => location.reload() }, ["Reload"]);
  }
  // Replace what To do shows (loading, sign in, could not load) and end the busy state.
  function showOpen(...nodes) {
    const box = $("open");
    box.removeAttribute("aria-busy");
    box.replaceChildren(...nodes);
    return box;
  }
  // srMore: words only a screen reader hears, so two "All" chips have different names.
  function chip(label, count, pressed, onclick, k, srMore) {
    return el("button", { class: "chip", type: "button", "aria-pressed": String(pressed), "data-k": k, onclick },
      [el("span", {}, [label, srMore ? el("span", { class: "sr", text: " " + srMore }) : null]),
        count == null ? null : el("span", { class: "n" }, [String(count), el("span", { class: "sr", text: " to do" })])]);
  }
  // After a filter click, say what the list now shows.
  function sayFilter() {
    const n = $("open").querySelectorAll("article").length;
    say("Showing " + n + (kind === ALL ? "" : " " + KIND_LABEL[kind]) + " to do" + (project === ALL ? "" : " in " + project) + ".");
  }

  // Focus: remember the focused control, and put it back (or on its receipt) after a redraw.
  function takeFocus() {
    const a = document.activeElement;
    if (!a || !a.dataset || !a.dataset.k) return null;
    return { k: a.dataset.k, card: a.dataset.card, inOpen: !!a.closest("#open"),
      sel: a.tagName === "TEXTAREA" ? [a.selectionStart, a.selectionEnd] : null };
  }
  // What focus to put back after a redraw: the focused control, or the one a click
  // disabled (held) once its row is no longer busy. Focus the user moved elsewhere wins.
  function focusToKeep() {
    const f = takeFocus();
    if (!held) return f;
    const a = document.activeElement;
    const away = a && a !== document.body && a !== document.documentElement && !(f && f.k === held.k);
    if (away) { held = null; return f; }
    if (busy.has(held.card)) return f;
    const h = held;
    held = null;
    return h;
  }
  function find(k) { return [...document.querySelectorAll("[data-k]")].find((n) => n.dataset.k === k) || null; }
  function giveFocus(f) {
    // A focus the user asked for (open a note, Show all kinds) may scroll; one that only
    // follows a redraw must not move the page.
    if (focusNext) {
      const n = find(focusNext) || find("h-open");
      focusNext = null;
      if (n && n !== document.activeElement) { n.focus(); return; }
    }
    let n = null;
    for (const k of focusOrder(f)) if ((n = find(k))) break;
    if (!n || n === document.activeElement) return;
    n.focus({ preventScroll: true });
    if (f.sel && n.tagName === "TEXTAREA" && n.dataset.k === f.k) n.setSelectionRange(f.sel[0], f.sel[1]);
  }

  // Every redraw goes through here. user: the user's own action asked for it.
  // Returns whether it drew now.
  function requestRender(user) {
    if (!docs || !drawNow({ anchoring, typing: typing(), user })) { dirty = true; return false; }
    render();
    return true;
  }
  // Draw a put-off redraw, but not between a pointer press and its click: replacing the
  // control under the pointer would lose the click.
  function flush() { if (dirty && !pointerDown) requestRender(false); }
  // Typing: a note box that is still open has focus, and was typed in lately.
  function typing() {
    const a = document.activeElement;
    return !!(a && a.tagName === "TEXTAREA" && composers.has(a.dataset.card) && Date.now() - lastInput < IDLE_MS);
  }

  function render() {
    dirty = false;
    const focus = focusToKeep();
    const now = Date.now();
    const view = projectView(docs, project);
    const all = view.all, projects = view.projects;
    project = view.project;

    // Summary across every project.
    const sum = $("summary"); sum.replaceChildren();
    if (!docs.length) sum.append("Nothing yet.");
    else if (!all.open.length) sum.append("You’re all caught up.");
    else sum.append(el("span", {}, [el("strong", { text: String(all.open.length) }), all.open.length === 1 ? " needs you" : " need you"]));
    if (all.wait.length) sum.append(el("span", {}, [el("strong", { text: String(all.wait.length) }), " waiting for the chat"]));

    // Project filter, shown when there is more than one project.
    const pBox = $("projects"); pBox.replaceChildren();
    pBox.hidden = projects.length < 2;
    const openBy = countBy(all.open, projectOf);
    const setProject = (p) => { project = p; try { localStorage.setItem(PROJECT_KEY, p); } catch (e) {} if (requestRender(true)) sayFilter(); };
    pBox.append(el("span", { class: "filters-label", "aria-hidden": "true", text: "Project" }),
      chip("All", all.open.length, project === ALL, () => setProject(ALL), ALL_PROJECTS, "projects"));
    for (const p of projects) pBox.append(chip(p, openBy.get(p) || 0, project === p, () => setProject(p), fkey(ALL_PROJECTS, p)));

    const scoped = inProject(docs, project);
    const mine = sections(scoped);
    // Kind filter for To do, shown when its asks are of more than one kind.
    const kindsBy = countBy(mine.open, (d) => kindOf(d.data));
    const setKind = (x) => { kind = x; if (requestRender(true)) sayFilter(); };
    const kBox = $("kinds"); kBox.replaceChildren();
    kBox.hidden = kindsBy.size < 2 && kind === ALL;
    if (!kBox.hidden) {
      kBox.append(chip("All", mine.open.length, kind === ALL, () => setKind(ALL), ALL_KINDS, "kinds"));
      for (const x of KINDS) if (kindsBy.has(x) || kind === x) kBox.append(chip(KIND_LABEL[x], kindsBy.get(x) || 0, kind === x, () => setKind(x), fkey(ALL_KINDS, x)));
    }

    // To do.
    const open = ofKind(mine.open, kind);
    const items = todoItems(open, ofKind(scoped, kind), flashes, now);
    const box = showOpen();
    $("n-open").textContent = open.length ? String(open.length) : "";
    const groups = project === ALL ? byProject(items) : [];
    const draw = (list, level, showProject) => list.map((it) => it.receipt ? receipt(it.d) : card(it.d, "open", showProject, level));
    if (groups.length > 1) {
      for (const [p, list] of groups) {
        const n = list.filter((it) => !it.receipt).length;
        box.append(el("div", { class: "group" }, [el("h3", { class: "group-head" }, [p, el("span", { class: "n", text: n ? String(n) : "" })]), ...draw(list, 4, false)]));
      }
    } else {
      box.append(...draw(items, 3, view.named));
    }
    if (!items.length) {
      const where = project === ALL ? "" : " in " + project;
      if (!docs.length) box.append(empty("No asks yet", "When a chat needs something from you, it shows up here. You don’t need to reload."));
      else if (mine.open.length) box.append(empty("No " + KIND_LABEL[kind].toLowerCase() + " asks" + where, "",
        el("button", { class: "btn line", type: "button", "data-k": "empty-all",
          onclick: () => { focusNext = ALL_KINDS; setKind(ALL); } }, ["Show all kinds"])));
      else box.append(empty("Nothing needs you" + where, "New asks show up here as soon as a chat adds them."));
    }

    // Waiting for the chat, and Closed (the newest 40; the count says when there are more).
    for (const where of ["wait", "closed"]) {
      const b = $(where); b.replaceChildren();
      for (const d of mine[where]) b.append(card(d, where, view.named, 3));
      const n = mine[where].length, more = where === "closed" && mine.closedTotal > n;
      $("n-" + where).textContent = n ? (more ? n + " newest of " + mine.closedTotal : String(n)) : "";
      $(where + "-wrap").hidden = !n;
    }

    // Banner.
    const ban = $("banner");
    ban.hidden = !lost;
    if (lost && !ban.childNodes.length) {
      ban.append(icon("error"), el("span", { text: "Lost the live link, so new asks and answers may not show." }), reloadBtn());
    }

    giveFocus(focus);
    // Redraw when the next flash ends, so its receipt or line goes away.
    clearTimeout(flashTimer);
    let next = Infinity;
    for (const [id, f] of flashes) { if (f.until <= now) flashes.delete(id); else next = Math.min(next, f.until); }
    if (next < Infinity) flashTimer = setTimeout(() => requestRender(false), next - now + 50);
  }

  async function start() {
    const c = window.claude;
    db = c && c.use ? await c.use("db").catch(() => null) : null;
    c && c.use && c.use("assets").then((a) => { assets = a; requestRender(false); }, () => {});
    c && c.use && c.use("comments").then((x) => { comments = x; }, () => {});
    if (!db) {
      showOpen(empty("Sign in to see your asks", "Open this page while signed in to claude.ai. The board lives in your account."));
      return;
    }
    db.collection("asks").onSnapshot((snap) => {
      docs = snap.docs.filter((s) => s.exists).map((s) => ({ id: s.id, data: s.data() }));
      if (lost) { lost = false; $("banner").replaceChildren(); }
      requestRender(false);
    }, () => {
      lost = true;
      // Once the board is drawn, the banner (role=alert) says it.
      if (docs) { requestRender(false); return; }
      say("Could not load your asks. Reload the page.");
      showOpen(empty("Could not load your asks", "The live link to the board failed.", reloadBtn()));
    });
    setTimeout(() => {
      if (docs || lost) return;
      showOpen(empty("Still loading your asks", "This is taking longer than usual.", reloadBtn()));
    }, LOAD_MS);
    // A put-off redraw is drawn when the user leaves the note box, once any click is over.
    document.addEventListener("input", () => { lastInput = Date.now(); }, true);
    document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
    for (const t of ["pointerup", "pointercancel"]) document.addEventListener(t, () => { pointerDown = false; setTimeout(flush, 0); }, true);
    document.addEventListener("focusout", () => setTimeout(flush, 0));
    setInterval(() => requestRender(false), 60000);
  }
  start();
})();
</script>

</body></html>
