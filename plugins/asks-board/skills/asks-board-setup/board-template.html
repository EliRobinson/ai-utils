<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Asks for {{OWNER}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column. Header with a summary across projects, project filter, then
   To do (grouped by project in the All view, with a kind filter), Waiting for the chat, Closed. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --panel-2: #eceee9;
  --ink: #1b2224;
  --muted: #54626a;
  --line: #d6dbd3;
  --line-strong: #a9b2a6;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #e1ecf5;
  --ok: #2b6a4a;
  --error: #a12a2a;
  --error-soft: #fbe9e7;
  --do: #2b6a4a;
  --decide: #7d5000;
  --approve: #7a2f6b;
  --code-bg: #eceee9;
  --skeleton: #e3e6e0;
  --shadow: 0 1px 2px rgb(20 30 30 / 0.06), 0 2px 8px rgb(20 30 30 / 0.04);
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121819; --panel: #1a2224; --panel-2: #161d1f; --ink: #e6ebe8; --muted: #a0adae; --line: #2c383b; --line-strong: #4a585c;
    --accent: #78b8e3; --accent-ink: #0b1820; --accent-soft: #1c3242;
    --ok: #74d3a0; --error: #ff9a8f; --error-soft: #3a1f1d;
    --do: #74d3a0; --decide: #e9b955; --approve: #e5a0d6; --code-bg: #232c2f; --skeleton: #222b2e;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121819; --panel: #1a2224; --panel-2: #161d1f; --ink: #e6ebe8; --muted: #a0adae; --line: #2c383b; --line-strong: #4a585c;
  --accent: #78b8e3; --accent-ink: #0b1820; --accent-soft: #1c3242;
  --ok: #74d3a0; --error: #ff9a8f; --error-soft: #3a1f1d;
  --do: #74d3a0; --decide: #e9b955; --approve: #e5a0d6; --code-bg: #232c2f; --skeleton: #222b2e;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: var(--accent); text-underline-offset: 0.18em; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 740px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 24px; }

/* Header */
header { display: grid; gap: 6px; }
h1 { font-weight: 700; font-size: 1.75rem; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.summary { margin: 0; font-size: 1.0625rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.summary strong { font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); margin: 0; font-size: 0.9375rem; max-width: 62ch; }

/* Filters: chips with aria-pressed */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters-label { color: var(--muted); font-size: 0.875rem; margin-right: 2px; }
.chip { font: inherit; font-size: 0.9375rem; font-weight: 700; min-height: 36px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip:hover { border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.n { font-family: var(--mono); font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .n { opacity: 0.8; }

/* Banner (lost live link) */
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--error-soft); color: var(--ink); border: 1px solid var(--error); border-radius: 10px; padding: 10px 14px; }
.banner svg { color: var(--error); }

/* Sections */
section { display: grid; gap: 12px; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
h2 { font-weight: 700; font-size: 1.1875rem; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h2 .n { color: var(--muted); font-size: 0.875rem; }
.section-note { margin: -6px 0 0; color: var(--muted); font-size: 0.875rem; }
.group { display: grid; gap: 10px; }
.group + .group { margin-top: 8px; }
h3.group-head { font-size: 0.9375rem; font-weight: 700; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: baseline; }
.list { display: grid; gap: 10px; }

/* Card */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px 8px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 4px; box-shadow: var(--shadow); }
.card.waiting { background: var(--panel-2); box-shadow: none; }
.card.closed { background: transparent; box-shadow: none; padding-block: 10px; }
.tick { display: grid; place-items: start center; padding-top: 2px; min-height: 44px; cursor: pointer; }
.check { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.check:disabled { cursor: default; }
.main { display: grid; gap: 10px; min-width: 0; }
.head { display: grid; gap: 4px; }
.meta { color: var(--muted); font-size: 0.875rem; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
.meta > span { display: inline-flex; gap: 5px; align-items: center; }
.kind { font-weight: 700; }
.kind.do { color: var(--do); } .kind.decide { color: var(--decide); } .kind.approve { color: var(--approve); }
.title { font-weight: 700; font-size: 1.0625rem; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.closed .title { font-weight: 400; color: var(--muted); }
.state { font-weight: 700; color: var(--ink); }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Options */
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.opt { font: inherit; text-align: left; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); padding: 10px 12px; border-radius: 10px; cursor: pointer; display: grid; gap: 2px; min-height: 48px; align-content: start; }
.waiting .opt { background: var(--panel); }
.opt:hover { border-color: var(--accent); }
.opt .key { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .key b { font-family: var(--mono); font-weight: 600; }
.opt small { font-size: 0.9375rem; color: inherit; }
.tag { font-size: 0.75rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 8px; }
.opt.rec { border-color: var(--accent); }
.opt.chosen { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.chosen .tag { background: var(--accent-ink); color: var(--accent); }
.opt.nokey { border-style: dashed; color: var(--muted); cursor: default; }
.opt.nokey:hover { border-color: var(--line-strong); }

/* Actions */
.actions { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-left: -8px; }
.btn { font: inherit; font-size: 0.9375rem; font-weight: 700; border: 1px solid transparent; background: transparent; color: var(--accent); padding: 6px 10px; min-height: 36px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.line { border-color: var(--line-strong); }
.btn[aria-expanded="true"] .ico { transform: rotate(180deg); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.receipt:focus-visible { outline-offset: -1px; }

/* Feedback next to the card */
.feedback { margin: 0; font-size: 0.9375rem; display: flex; gap: 6px; align-items: flex-start; }
.feedback .ico { margin-top: 3px; }
.feedback.ok { color: var(--ok); }
.feedback.busy { color: var(--muted); }
.feedback.error { color: var(--error); }
.receipt { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; color: var(--muted); }
.receipt .title { font-size: 0.9375rem; color: var(--muted); }

/* Detail, notes, code */
.detail { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; max-width: 70ch; }
.waiting .detail { background: var(--panel); }
.detail p { margin: 0; overflow-wrap: anywhere; }
.detail ul, .detail ol { margin: 0; padding-left: 1.3em; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.detail code { background: var(--panel); }
.code { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.code pre { margin: 0; padding: 10px 12px; padding-right: 76px; overflow-x: auto; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.5; }
.code pre code { background: none; padding: 0; }
.code .btn { position: absolute; top: 4px; right: 4px; background: var(--panel); }
.note { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: 0.9375rem; overflow-wrap: anywhere; }
.compose { display: grid; gap: 8px; }
.compose label { font-weight: 700; font-size: 0.9375rem; }
textarea { font: inherit; width: 100%; min-height: 88px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; background: var(--panel); color: var(--ink); resize: vertical; caret-color: var(--accent); }
textarea:focus-visible { outline-offset: 0; border-color: var(--accent); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { margin: 0; display: grid; gap: 4px; justify-items: start; }
.thumb img { display: block; max-width: min(220px, 100%); max-height: 140px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
.hint { color: var(--muted); font-size: 0.875rem; margin: 0; }

/* Empty, loading */
.empty { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 20px; display: grid; gap: 4px; justify-items: start; }
.empty strong { font-size: 1.0625rem; }
.empty p { margin: 0; color: var(--muted); }
.skel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--skeleton); }
.skel i:nth-child(1) { width: 30%; } .skel i:nth-child(2) { width: 75%; height: 16px; } .skel i:nth-child(3) { width: 55%; }

/* Closed */
details.closed-wrap > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; min-height: 44px; border-radius: 8px; }
details.closed-wrap > summary::-webkit-details-marker { display: none; }
details.closed-wrap > summary .ico { color: var(--muted); transform: rotate(-90deg); }
details.closed-wrap[open] > summary .ico { transform: none; }
details.closed-wrap .list { margin-top: 8px; gap: 6px; }

@media (max-width: 520px) {
  .wrap { padding-inline: 12px; padding-top: 16px; gap: 20px; }
  h1 { font-size: 1.5rem; }
  .card { grid-template-columns: 40px minmax(0, 1fr); padding-right: 12px; }
  .btn, .chip { min-height: 44px; }
}
@media (pointer: coarse) { .btn, .chip { min-height: 44px; } }
@media (prefers-reduced-motion: no-preference) {
  .btn .ico, details.closed-wrap > summary .ico { transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
  .feedback, .receipt { animation: rise .25s cubic-bezier(.2, .8, .2, 1); }
  .skel i { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } }
  @keyframes pulse { 50% { opacity: 0.55; } }
}
@media (forced-colors: active) {
  .chip[aria-pressed="true"], .opt.chosen { outline: 2px solid CanvasText; }
  .ico { stroke: CanvasText; }
}
</style>

<div class="wrap">
  <header>
    <h1>Asks for {{OWNER}}</h1>
    <p class="summary" id="summary"></p>
    <p class="sub">What your Claude chats need from you. Tick it when done, pick an answer, or add a note. The chat that asked hears about it right away.</p>
  </header>
  <div class="banner" id="banner" role="alert" hidden></div>
  <div class="filters" id="projects" role="group" aria-label="Show project" hidden></div>
  <section aria-labelledby="h-open">
    <div class="section-head">
      <h2 id="h-open">To do <span class="n" id="n-open"></span></h2>
      <div class="filters" id="kinds" role="group" aria-label="Show kind" hidden></div>
    </div>
    <div class="list" id="open" aria-busy="true">
      <p class="sr">Loading your asks…</p>
      <div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </section>
  <section aria-labelledby="h-wait" id="wait-wrap" hidden>
    <h2 id="h-wait">Waiting for the chat <span class="n" id="n-wait"></span></h2>
    <p class="section-note">You answered these. The chat closes each one when it acts.</p>
    <div class="list" id="wait"></div>
  </section>
  <details class="closed-wrap" id="closed-wrap" hidden>
    <summary><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><h2 id="h-closed">Closed <span class="n" id="n-closed"></span></h2></summary>
    <div class="list" id="closed"></div>
  </details>
  <p class="sr" id="status" role="status"></p>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // BEGIN pure (scripts/check-board-page.mjs runs these in node)
  // Which section each row goes in, by status alone. Only status "closed" puts a row
  // in Closed: an old ackAt on an answered row must still show it as waiting.
  // An unknown status lands in wait, so a row with a typo never vanishes.
  const SECTION = { open: "open", done: "wait", answered: "wait", dismissed: "wait", closed: "closed" };
  function sections(rows) {
    const out = { open: [], wait: [], closed: [] };
    for (const d of rows) {
      const st = String(d.data.status || "open");
      // Own keys only: a status such as "constructor" must not reach Object.prototype.
      out[Object.hasOwn(SECTION, st) ? SECTION[st] : "wait"].push(d);
    }
    out.open.sort((x, y) => String(x.data.createdAt).localeCompare(String(y.data.createdAt)));
    out.closed.sort((x, y) => String(y.data.updatedAt).localeCompare(String(x.data.updatedAt)));
    out.closed = out.closed.slice(0, 40);
    return out;
  }
  // Every click writes this: the change, a fresh updatedAt, and ackAt cleared (db has
  // no field delete, so null), so the chat sees the click as new.
  function stamp(patch, now) {
    return Object.assign({ updatedAt: now }, patch, { ackAt: null });
  }
  // One option's key and label, each on one line (a line break could add a fake line to
  // the ping text). Rows use {key, label}; a row written with {id, label} still works, and
  // an empty key falls back to id. A bare string is its own key. key is "" when there is
  // no usable key or id: the button must not write then.
  // An object or list is not text, so it counts as missing.
  function oneLine(v) {
    if (v == null || typeof v === "object") return "";
    return String(v).replace(/[\r\n\v\f\u0085\u2028\u2029]+/g, " ").trim();
  }
  function option(o) {
    if (o == null) return { key: "", label: "" };
    if (typeof o !== "object") return { key: oneLine(o), label: "" };
    return { key: oneLine(o.key) || oneLine(o.id), label: oneLine(o.label) };
  }
  // A row value (answer, recommended) names this key. The empty key matches nothing, so a
  // row with no answer or no recommended marks no button.
  function matchesKey(value, key) {
    return key !== "" && value != null && oneLine(value) === key;
  }
  // Everything one option button shows and does. send is what a click writes, says and
  // pings; it is null when the option has no key, and then a click writes nothing.
  // Chosen wins over recommended for the style.
  function optionButton(o, row) {
    const { key, label } = option(o);
    const chosen = matchesKey(row.answer, key);
    const rec = matchesKey(row.recommended, key);
    const writable = key !== "";
    return {
      key, label, chosen, rec, writable,
      cls: "opt" + (!writable ? " nokey" : chosen ? " chosen" : rec ? " rec" : ""),
      text: key || "(no key)",
      send: writable ? {
        patch: { status: "answered", answer: key },
        said: "Sent “" + key + "”.",
        ping: "{{OWNER}} chose option " + key + (label ? ": " + label : "") + ".",
      } : null,
    };
  }
  // The other clicks, as data: what each writes (patch), what the page says (said), and
  // the line the ping carries (ping; null sends no ping).
  const ACTIONS = {
    done: () => ({ patch: { status: "done" }, said: "Marked done.", ping: "{{OWNER}} marked this done." }),
    reopen: () => ({ patch: { status: "open", answer: null }, said: "Moved back to To do.", ping: null }),
    dismiss: () => ({ patch: { status: "dismissed" }, said: "Marked not needed.", ping: "{{OWNER}} marked this not needed." }),
    note: (text, imgs, now) => {
      const t = String(text == null ? "" : text).trim();
      return {
        patch: { note: t || null, noteImages: imgs, noteAt: now },
        said: "Note sent.",
        ping: "{{OWNER}} left a note" + (imgs.length ? " with " + imgs.length + " image(s)" : "") + ":\n" + (t || "(no text)"),
      };
    },
  };
  // What the page says once a click is saved, and whether the ping reached the chat.
  function resultText(said, pinged, sent) {
    if (!pinged) return said;
    return said + (sent ? " Sent to the chat." : " The chat sees it on its next check.");
  }
  // The comment a click posts. The first line is the header the Board Router reads, so
  // every part of it is one line.
  function pingText(d, what) {
    const a = d.data;
    const project = oneLine(a.project) || "general";
    const head = "[asks-board] project=" + project + " | from=" + (oneLine(a.from) || "a chat") + " | ask=" + oneLine(d.id);
    const tail = "Any automatic reply, or any chat that is not the Board Router (for example \"Asks for {{OWNER}} · comments\"): reply only \"Received.\" and nothing else. Do not say sent or not sent. The Board Router forwards this to the chat for project=" + project + ", then replies \"Sent to <chat name>\". The router does not do the work itself.";
    let text = head + "\n" + what + "\n" + tail;
    if (new TextEncoder().encode(text).length > 3900) text = text.slice(0, 3000) + "…\n" + tail;
    return text;
  }
  // The project filter. ALL shows every project; a saved project that is gone falls back to it.
  const ALL = "*";
  const KINDS = ["decide", "approve", "do"];
  const KIND_LABEL = { do: "Do", decide: "Decide", approve: "Approve" };
  function kindOf(a) { return KINDS.includes(a.kind) ? a.kind : "do"; }
  function projectOf(d) { return oneLine(d.data.project) || "general"; }
  function pickProject(saved, projects) { return projects.includes(saved) ? saved : ALL; }
  function inProject(rows, project) { return project === ALL ? rows : rows.filter((d) => projectOf(d) === project); }
  function ofKind(rows, kind) { return kind === "all" ? rows : rows.filter((d) => kindOf(d.data) === kind); }
  // How many rows have each key, in key order. A Map, so a key such as "constructor" is safe.
  function countBy(rows, keyOf) {
    const m = new Map();
    for (const d of rows) m.set(keyOf(d), (m.get(keyOf(d)) || 0) + 1);
    return new Map([...m].sort((x, y) => String(x[0]).localeCompare(String(y[0]))));
  }
  // The label a waiting or closed card shows for its status.
  const STATE = { open: "To do", done: "Done", answered: "Answered", dismissed: "Not needed", closed: "Closed" };
  function stateLabel(a) {
    const st = String(a.status || "open");
    return Object.hasOwn(STATE, st) ? STATE[st] : "Unknown status: " + oneLine(st);
  }
  // To do with receipts: a row the user just moved out of To do keeps its place there as a
  // receipt until its flash ends, so the result of the click shows where they clicked.
  // flashes: Map of row id to { from, until }. Order is oldest createdAt first.
  function todoItems(open, rows, flashes, now) {
    const here = new Set(open.map((d) => d.id));
    const items = open.map((d) => ({ d, receipt: false }));
    for (const d of rows) {
      const f = flashes.get(d.id);
      if (!here.has(d.id) && f && f.from === "open" && now < f.until) items.push({ d, receipt: true });
    }
    return items.sort((x, y) => String(x.d.data.createdAt).localeCompare(String(y.d.data.createdAt)));
  }
  // Items by project, projects in name order.
  function byProject(items) {
    const m = new Map();
    for (const it of items) {
      const p = projectOf(it.d);
      if (!m.has(p)) m.set(p, []);
      m.get(p).push(it);
    }
    return [...m].sort((x, y) => x[0].localeCompare(y[0]));
  }
  function ago(iso, now) {
    if (!iso) return "";
    const s = (now - Date.parse(iso)) / 1000;
    if (!isFinite(s)) return "";
    if (s < 90) return "just now";
    if (s < 5400) return Math.round(s / 60) + " min ago";
    if (s < 129600) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }
  // END pure

  let db = null, docs = null, comments = null, assets = null;
  let project = ALL, kind = "all", lost = false;
  const openDetails = new Set();
  const openNotes = new Set();
  const drafts = new Map();
  const pics = new Map();
  // Row id -> { text, tone, from, until }: the result line next to the clicked card.
  const flashes = new Map();
  const FLASH_MS = 15000, ERROR_MS = 60000;
  let focusNext = null, flashTimer = 0;
  try { project = localStorage.getItem("asks.tab") || ALL; } catch (e) {}

  const ICONS = {
    do: '<path d="M20 6 9 17l-5-5"/>',
    decide: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v1A3.5 3.5 0 0 0 9.5 13h5A3.5 3.5 0 0 0 18 9.5v-1M12 13v2.5"/>',
    approve: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    sent: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
    note: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    more: '<path d="m6 9 6 6 6-6"/>',
    dismiss: '<path d="M18 6 6 18M6 6l12 12"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
    ok: '<path d="M20 6 9 17l-5-5"/>',
    busy: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    error: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
  };
  function icon(name) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "ico"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = ICONS[name];
    return s;
  }
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const c of [].concat(kids || [])) if (c) n.append(c);
    return n;
  }

  // The same text twice is cleared first, so a screen reader announces it again.
  const REANNOUNCE_MS = 100;
  let sayTimer = 0;
  function say(t) {
    const s = $("status");
    clearTimeout(sayTimer);
    if (s.textContent !== t) { s.textContent = t; return; }
    s.textContent = "";
    sayTimer = setTimeout(() => { s.textContent = t; }, REANNOUNCE_MS);
  }
  // Show a result next to the card (and tell screen readers through the status line).
  function flash(id, text, tone, from, quiet) {
    flashes.set(id, { text, tone, from, until: Date.now() + (tone === "error" ? ERROR_MS : FLASH_MS) });
    if (!quiet) say(text);
  }

  // Inline: `code` and **bold**. Everything else is plain text.
  function inline(text) {
    const frag = document.createDocumentFragment();
    const re = /(`[^`]+`|\*\*[^*]+\*\*)/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      const t = m[0];
      frag.append(t[0] === "`" ? el("code", { text: t.slice(1, -1) }) : el("strong", { text: t.slice(2, -2) }));
      last = m.index + t.length;
    }
    if (last < text.length) frag.append(text.slice(last));
    return frag;
  }
  function copyBtn(getText) {
    const b = el("button", { class: "btn line", type: "button", text: "Copy" });
    b.addEventListener("click", () => {
      const t = getText();
      const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500); };
      try { navigator.clipboard.writeText(t).then(done, () => (b.textContent = "Select it")); }
      catch (e) { b.textContent = "Select it"; }
    });
    return b;
  }
  // Detail text: paragraphs, "- " bullets, "1. " steps, ``` fenced code with a Copy button.
  function renderDetail(src, id) {
    const box = el("div", { class: "detail", id });
    const lines = String(src || "").replace(/\r/g, "").split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        const text = buf.join("\n");
        box.append(el("div", { class: "code" }, [el("pre", {}, [el("code", { text })]), copyBtn(() => text)]));
        continue;
      }
      const bullet = /^\s*[-*] (.*)/, step = /^\s*\d+[.)] (.*)/;
      if (bullet.test(line) || step.test(line)) {
        const ordered = step.test(line), re = ordered ? step : bullet;
        const list = el(ordered ? "ol" : "ul");
        while (i < lines.length && re.test(lines[i])) list.append(el("li", {}, [inline(lines[i++].match(re)[1])]));
        box.append(list);
        continue;
      }
      if (line.trim() === "") { i++; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() !== "" && !/^```/.test(lines[i]) && !bullet.test(lines[i]) && !step.test(lines[i])) buf.push(lines[i++]);
      box.append(el("p", {}, [inline(buf.join(" "))]));
    }
    return box;
  }
  function thumbs(list, onRemove) {
    const box = el("div", { class: "thumbs" });
    list.forEach((p, i) => {
      const src = "/_blob/" + p.id;
      const fig = el("figure", { class: "thumb" }, [
        el("a", { href: src, target: "_blank", rel: "noopener", "aria-label": "Open image " + (i + 1) }, [el("img", { src, alt: p.caption || "Screenshot " + (i + 1) })]),
      ]);
      if (p.caption) fig.append(el("figcaption", { class: "hint", text: p.caption }));
      if (onRemove) fig.append(el("button", { class: "btn", type: "button", text: "Remove image " + (i + 1), onclick: () => onRemove(i) }));
      box.append(fig);
    });
    return box;
  }
  async function addPics(id, files, where) {
    if (!assets || !files.length) return;
    const list = pics.get(id) || [];
    pics.set(id, list);
    flash(id, "Uploading " + files.length + " image" + (files.length > 1 ? "s" : "") + "…", "busy", where);
    render();
    for (const f of files) {
      try { const r = await assets.upload(f); list.push({ id: r.id }); }
      catch (e) { flash(id, "Could not upload " + (f.name || "the image") + ". Try a smaller PNG or JPG.", "error", where); render(); return; }
    }
    flash(id, "Image added. Press Send note to save it.", "ok", where);
    render();
  }

  // Ping: post a comment on the ask's own thread and send it to Claude.
  // One Board Router chat watches this board and forwards each ping to the
  // project's chat, named in the routes collection.
  async function ping(d, anchorP, what) {
    if (!comments) return false;
    let can = "off";
    try { can = await comments.canSendToClaude(); } catch (e) { return false; }
    if (can !== "available") return false;
    const text = pingText(d, what);
    const tid = d.data.threadId;
    try {
      let r;
      try {
        r = tid ? await comments.sendToClaude({ threadId: tid, text }) : null;
      } catch (e) {
        if (!(e && e.code === "not_found")) throw e;
        r = null;
      }
      if (!r) {
        const anchor = anchorP ? await anchorP : null;
        if (!anchor) return false;
        r = await comments.sendToClaude({ anchor, text });
      }
      if (r && r.threadId && r.threadId !== tid && db) {
        db.collection("asks").doc(d.id).update({ threadId: r.threadId }).catch(() => {});
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  // One viewer action: save send.patch, ping the asking chat with send.ping, and show the
  // result next to the card. anchorFor runs first, inside the click (it needs the gesture),
  // and the card is redrawn only after it settles.
  function act(ev, d, send, where) {
    const node = ev && ev.currentTarget && ev.currentTarget.closest ? ev.currentTarget.closest("article") : null;
    const anchorP = comments && node ? comments.anchorFor(node).catch(() => null) : null;
    const pinged = send.ping ? ping(d, anchorP, send.ping) : Promise.resolve(false);
    flash(d.id, "Saving…", "busy", where, true);
    const saved = write(d.id, send.patch);
    if (anchorP) anchorP.then(render); else render();
    Promise.all([saved, pinged]).then(([err, sent]) => {
      if (err) flash(d.id, err, "error", where);
      else flash(d.id, resultText(send.said, !!send.ping, sent), "ok", where);
      render();
    });
  }

  // Saves the change; returns null, or the error text to show.
  async function write(id, patch) {
    if (!db) return "Not connected. Reload the page.";
    try {
      await db.collection("asks").doc(id).update(stamp(patch, new Date().toISOString()));
      return null;
    } catch (e) {
      return e && e.code === "invalid_argument" ? "You can only read this list, so nothing was saved." : "Could not save. Check your connection and try again.";
    }
  }

  // Controls carry data-k, so focus can come back to the same control after a redraw.
  function ctl(tag, k, d, attrs, kids) {
    return el(tag, Object.assign({ "data-k": k + ":" + d.id, "data-card": d.id }, attrs), kids);
  }
  function feedbackLine(f) {
    return el("p", { class: "feedback " + f.tone }, [icon(f.tone), el("span", { text: f.text })]);
  }

  function card(d, where, showProject, level) {
    const a = d.data, now = Date.now();
    const k = kindOf(a);
    const titleId = "t-" + d.id;
    const item = el("article", { class: "card " + where, "aria-labelledby": titleId });
    const check = ctl("input", "chk", d, { type: "checkbox", class: "check", "aria-label": "Done: " + oneLine(a.title || "(no title)") });
    check.checked = where !== "open";
    check.disabled = where === "closed";
    check.addEventListener("change", (ev) => act(ev, d, check.checked ? ACTIONS.done() : ACTIONS.reopen(), where));
    item.append(el("label", { class: "tick" }, [check]));

    const main = el("div", { class: "main" });
    const meta = el("div", { class: "meta" }, [
      el("span", { class: "kind " + k }, [icon(k), KIND_LABEL[k]]),
      showProject ? el("span", { text: projectOf(d) }) : null,
      el("span", { text: oneLine(a.from) || "a chat" }),
      el("span", { text: ago(where === "open" ? a.createdAt : a.updatedAt || a.createdAt, now) }),
    ]);
    if (where !== "open") meta.append(el("span", { class: "state", text: stateLabel(a) + (a.answer != null && a.answer !== "" ? " · you chose " + oneLine(a.answer) : "") }));
    else if (a.answer != null && a.answer !== "") meta.append(el("span", { class: "state", text: "You chose " + oneLine(a.answer) }));
    if (a.threadId) meta.append(el("span", {}, [icon("sent"), "Sent to chat"]));
    main.append(el("div", { class: "head" }, [meta, el("h" + level, { class: "title", id: titleId }, [inline(a.title || "(no title)")])]));

    if (where === "closed") { item.append(main); return item; }

    if (Array.isArray(a.images) && a.images.length) main.append(thumbs(a.images));
    if (Array.isArray(a.options) && a.options.length) {
      const opts = el("div", { class: "options", role: "group", "aria-label": "Answers" });
      let noKey = false;
      for (const o of a.options) {
        const b = optionButton(o, a);
        if (!b.writable) noKey = true;
        opts.append(ctl("button", "opt-" + b.key, d, {
          class: b.cls, type: "button", "aria-pressed": String(b.chosen),
          onclick: (ev) => b.writable ? act(ev, d, b.send, where) : noKeyClick(d, where),
        }, [
          el("span", { class: "key" }, [el("b", { text: b.text }), b.rec ? el("span", { class: "tag", text: "Recommended" }) : null]),
          b.label ? el("small", { text: b.label }) : null,
        ]));
      }
      main.append(opts);
      if (noKey) main.append(el("p", { class: "hint", text: "An option marked (no key) can’t be sent. Add a note to tell the chat." }));
    }
    if (a.note || (Array.isArray(a.noteImages) && a.noteImages.length)) {
      const n = el("div", { class: "note" }, [el("strong", { text: "Your note: " }), a.note || ""]);
      if (Array.isArray(a.noteImages) && a.noteImages.length) n.append(thumbs(a.noteImages));
      main.append(n);
    }

    const row = el("div", { class: "actions" });
    if (a.detail) {
      const showing = openDetails.has(d.id);
      row.append(ctl("button", "det", d, { class: "btn", type: "button", "aria-expanded": String(showing), "aria-controls": "d-" + d.id,
        onclick: () => { showing ? openDetails.delete(d.id) : openDetails.add(d.id); render(); } }, [showing ? "Hide details" : "Details", icon("more")]));
    }
    const composing = openNotes.has(d.id);
    row.append(ctl("button", "nb", d, { class: "btn", type: "button", "aria-expanded": String(composing),
      onclick: () => { if (composing) openNotes.delete(d.id); else { openNotes.add(d.id); focusNext = "ta:" + d.id; } render(); } },
      [icon("note"), a.note ? "Edit note" : "Add a note"]));
    if (where === "open") {
      row.append(ctl("button", "dis", d, { class: "btn", type: "button",
        onclick: (ev) => act(ev, d, ACTIONS.dismiss(), where) }, [icon("dismiss"), "Not needed"]));
    }
    main.append(row);
    const f = flashes.get(d.id);
    if (f && now < f.until) main.append(feedbackLine(f));
    if (a.detail && openDetails.has(d.id)) main.append(renderDetail(a.detail, "d-" + d.id));
    if (composing) main.append(composer(d, where));
    item.append(main);
    return item;
  }

  function noKeyClick(d, where) {
    flash(d.id, "This option has no key, so nothing was sent. Write a note to tell the chat instead.", "error", where);
    openNotes.add(d.id); focusNext = "ta:" + d.id;
    render();
  }

  function composer(d, where) {
    const a = d.data;
    const taId = "note-" + d.id;
    const ta = ctl("textarea", "ta", d, { id: taId });
    ta.value = drafts.has(d.id) ? drafts.get(d.id) : a.note || "";
    ta.addEventListener("input", () => drafts.set(d.id, ta.value));
    if (!pics.has(d.id)) pics.set(d.id, Array.isArray(a.noteImages) ? a.noteImages.slice() : []);
    const mine = pics.get(d.id);
    ta.addEventListener("paste", (ev) => {
      const files = [...(ev.clipboardData ? ev.clipboardData.files : [])].filter((f) => f.type.startsWith("image/"));
      if (files.length) { ev.preventDefault(); addPics(d.id, files, where); }
    });
    const send = (ev) => {
      const note = ACTIONS.note(ta.value, mine.slice(), new Date().toISOString());
      openNotes.delete(d.id); drafts.delete(d.id); pics.delete(d.id);
      focusNext = "nb:" + d.id;
      act(ev, d, note, where);
    };
    ta.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); send(ev); } });
    const btns = el("div", { class: "actions" }, [
      ctl("button", "send", d, { class: "btn primary", type: "button", onclick: send }, ["Send note"]),
      ctl("button", "cancel", d, { class: "btn", type: "button",
        onclick: () => { openNotes.delete(d.id); drafts.delete(d.id); pics.delete(d.id); focusNext = "nb:" + d.id; render(); } }, ["Cancel"]),
    ]);
    const box = el("div", { class: "compose" }, [el("label", { for: taId, text: "Note for " + (oneLine(a.from) || "the chat") })]);
    box.append(ta);
    if (assets) {
      const fi = el("input", { type: "file", accept: "image/*", multiple: "", hidden: "" });
      fi.addEventListener("change", () => { addPics(d.id, [...fi.files], where); fi.value = ""; });
      btns.append(fi, ctl("button", "img", d, { class: "btn", type: "button", onclick: () => fi.click() }, [icon("image"), "Add image"]));
      box.append(el("p", { class: "hint", text: "Paste a screenshot into the box, or add an image. Ctrl or ⌘ + Enter sends." }));
    } else {
      box.append(el("p", { class: "hint", text: "Ctrl or ⌘ + Enter sends." }));
    }
    if (mine.length) box.append(thumbs(mine, (i) => { mine.splice(i, 1); render(); }));
    box.append(btns);
    return box;
  }

  function receipt(d) {
    const f = flashes.get(d.id);
    return el("div", { class: "receipt", tabindex: "-1", "data-k": "rcpt:" + d.id }, [
      el("p", { class: "title" }, [inline(d.data.title || "(no title)")]),
      feedbackLine(f),
    ]);
  }

  function empty(title, text, action) {
    return el("div", { class: "empty" }, [el("strong", { text: title }), text ? el("p", { text }) : null, action || null]);
  }
  // srMore: words only a screen reader hears, so two "All" chips have different names.
  function chip(label, count, pressed, onclick, srMore) {
    return el("button", { class: "chip", type: "button", "aria-pressed": String(pressed), onclick },
      [el("span", {}, [label, srMore ? el("span", { class: "sr", text: " " + srMore }) : null]),
        count == null ? null : el("span", { class: "n", text: String(count) })]);
  }

  // Focus: remember the focused control, and put it back (or on its receipt) after a redraw.
  function takeFocus() {
    const a = document.activeElement;
    if (!a || !a.dataset || !a.dataset.k) return null;
    return { k: a.dataset.k, card: a.dataset.card, sel: a.tagName === "TEXTAREA" ? [a.selectionStart, a.selectionEnd] : null };
  }
  function find(k) { return [...document.querySelectorAll("[data-k]")].find((n) => n.dataset.k === k) || null; }
  function giveFocus(f) {
    let n = null;
    if (focusNext) { n = find(focusNext); focusNext = null; }
    if (!n && f) n = (f.card && find("rcpt:" + f.card)) || find(f.k);
    if (!n || n === document.activeElement) return;
    n.focus();
    if (f && f.sel && n.tagName === "TEXTAREA" && n.dataset.k === f.k) n.setSelectionRange(f.sel[0], f.sel[1]);
  }

  function render() {
    if (!docs) return;
    const focus = takeFocus();
    const now = Date.now();
    const all = sections(docs);
    const projects = [...countBy(docs, projectOf).keys()];
    project = pickProject(project, projects);

    // Summary across every project.
    const sum = $("summary"); sum.replaceChildren();
    if (!docs.length) sum.append("Nothing yet.");
    else if (!all.open.length) sum.append("You’re all caught up.");
    else sum.append(el("span", {}, [el("strong", { text: String(all.open.length) }), all.open.length === 1 ? " needs you" : " need you"]));
    if (all.wait.length) sum.append(el("span", {}, [el("strong", { text: String(all.wait.length) }), " waiting for the chat"]));

    // Project filter, shown when there is more than one project.
    const pBox = $("projects"); pBox.replaceChildren();
    pBox.hidden = projects.length < 2;
    const openBy = countBy(all.open, projectOf);
    const setProject = (p) => { project = p; try { localStorage.setItem("asks.tab", p); } catch (e) {} render(); };
    pBox.append(el("span", { class: "filters-label", "aria-hidden": "true", text: "Project" }),
      chip("All", all.open.length, project === ALL, () => setProject(ALL), "projects"));
    for (const p of projects) pBox.append(chip(p, openBy.get(p) || 0, project === p, () => setProject(p)));

    const scoped = inProject(docs, project);
    const mine = sections(scoped);
    // Kind filter for To do, shown when its asks are of more than one kind.
    const kindsBy = countBy(mine.open, (d) => kindOf(d.data));
    const kBox = $("kinds"); kBox.replaceChildren();
    kBox.hidden = kindsBy.size < 2 && kind === "all";
    if (!kBox.hidden) {
      kBox.append(chip("All", mine.open.length, kind === "all", () => { kind = "all"; render(); }, "kinds"));
      for (const x of KINDS) if (kindsBy.has(x) || kind === x) kBox.append(chip(KIND_LABEL[x], kindsBy.get(x) || 0, kind === x, () => { kind = x; render(); }));
    }

    // To do.
    const open = ofKind(mine.open, kind);
    const items = todoItems(open, ofKind(scoped, kind), flashes, now);
    const box = $("open"); box.replaceChildren(); box.removeAttribute("aria-busy");
    $("n-open").textContent = mine.open.length ? String(mine.open.length) : "";
    const groups = project === ALL ? byProject(items) : [];
    const draw = (list, level) => list.map((it) => it.receipt ? receipt(it.d) : card(it.d, "open", false, level));
    if (groups.length > 1) {
      for (const [p, list] of groups) {
        const n = list.filter((it) => !it.receipt).length;
        box.append(el("div", { class: "group" }, [el("h3", { class: "group-head" }, [p, el("span", { class: "n", text: n ? String(n) : "" })]), ...draw(list, 4)]));
      }
    } else {
      box.append(...draw(items, 3));
    }
    if (!items.length) {
      const where = project === ALL ? "" : " in " + project;
      if (!docs.length) box.append(empty("No asks yet", "When a chat needs something from you, it shows up here. You don’t need to reload."));
      else if (mine.open.length) box.append(empty("No " + KIND_LABEL[kind].toLowerCase() + " asks" + where, "",
        el("button", { class: "btn line", type: "button", onclick: () => { kind = "all"; render(); } }, ["Show all kinds"])));
      else box.append(empty("Nothing needs you" + where, "New asks show up here as soon as a chat adds them."));
    }

    // Waiting for the chat, and Closed.
    const fill = (id, list, where) => {
      const b = $(id); b.replaceChildren();
      for (const d of list) b.append(card(d, where, project === ALL && projects.length > 1, 3));
      $("n-" + id).textContent = list.length ? String(list.length) : "";
    };
    fill("wait", mine.wait, "waiting");
    $("wait-wrap").hidden = !mine.wait.length;
    fill("closed", mine.closed, "closed");
    $("closed-wrap").hidden = !mine.closed.length;

    // Banner.
    const ban = $("banner");
    ban.hidden = !lost;
    if (lost && !ban.childNodes.length) {
      ban.append(icon("error"), el("span", { text: "Lost the live link, so new asks and answers may not show." }),
        el("button", { class: "btn line", type: "button", onclick: () => location.reload() }, ["Reload"]));
    }

    giveFocus(focus);
    // Redraw when the next flash ends, so its receipt or line goes away.
    clearTimeout(flashTimer);
    let next = Infinity;
    for (const [id, f] of flashes) { if (f.until <= now) flashes.delete(id); else next = Math.min(next, f.until); }
    if (next < Infinity) flashTimer = setTimeout(() => { if (!typing()) render(); else flashTimer = setTimeout(render, 5000); }, next - now + 50);
  }
  function typing() { return !!(document.activeElement && document.activeElement.tagName === "TEXTAREA"); }

  async function start() {
    const c = window.claude;
    db = c && c.use ? await c.use("db").catch(() => null) : null;
    c && c.use && c.use("assets").then((a) => { assets = a; render(); }, () => {});
    c && c.use && c.use("comments").then((x) => { comments = x; }, () => {});
    if (!db) {
      const box = $("open"); box.removeAttribute("aria-busy");
      box.replaceChildren(empty("Sign in to see your asks", "Open this page while signed in to claude.ai. The board lives in your account."));
      return;
    }
    db.collection("asks").onSnapshot((snap) => {
      docs = snap.docs.filter((s) => s.exists).map((s) => ({ id: s.id, data: s.data() }));
      if (lost) { lost = false; $("banner").replaceChildren(); }
      render();
    }, () => {
      lost = true;
      say("Lost the live link. Reload the page.");
      if (docs) { render(); return; }
      const box = $("open"); box.removeAttribute("aria-busy");
      box.replaceChildren(empty("Could not load your asks", "The live link to the board failed.",
        el("button", { class: "btn line", type: "button", onclick: () => location.reload() }, ["Reload"])));
    });
    setInterval(() => { if (!typing()) render(); }, 60000);
  }
  start();
})();
</script>

</body></html>
